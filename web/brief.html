<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#ffffff">
  <title>Raven · Task context</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/brief.js"></script>
</head>
<body class="brief-body">
  <a class="skip" href="#brief-main">Skip to content</a>
  <header class="brief-top">
    <a class="brand" href="/"><img src="/favicon.svg" width="28" height="28" alt=""><span>Raven</span></a>
    <span class="brief-workspace" id="brief-workspace"></span>
    <div class="brief-top-right" id="brief-account"></div>
  </header>
  <main id="brief-main" tabindex="-1">
    <div id="brief" aria-live="polite"><div class="empty" role="status"><span class="loading-dot"></span>Opening the task…</div></div>
  </main>
  <dialog id="brief-modal" aria-labelledby="brief-modal-title"><div id="brief-modal-content"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
