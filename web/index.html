<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <title>Raven</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/workbench.css">
  <link rel="stylesheet" href="/objectives.css">
  <link rel="stylesheet" href="/intro.css">
  <link rel="stylesheet" href="/home.css">
  <script defer src="/presentation.js"></script>
  <script defer src="/task.js"></script>
  <script defer src="/workbench.js"></script>
  <script defer src="/objectives.js"></script>
  <script defer src="/evidence.js"></script>
  <script defer src="/app.js"></script>
  <script defer src="/interview.js"></script>
  <script defer src="/intro.js"></script>
  <script defer src="/home.js"></script>
  <script defer src="/map.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#ask"><img src="/favicon.svg" width="32" height="32" alt=""><span>Raven</span></a>

    <nav aria-label="Workspace navigation">
      <a href="#ask" data-view="ask" aria-label="Ask Raven"><span data-icon="chat"></span><span class="nav-text">Ask Raven</span><span class="nav-count" id="inbox-count" hidden>0</span></a>
      <a href="#map" data-view="map" aria-label="Map"><span data-icon="users"></span><span class="nav-text">Map</span></a>
      <a href="#connect" data-view="connect" aria-label="Settings"><span data-icon="settings"></span><span class="nav-text">Settings</span><span class="nav-dot" id="settings-dot" hidden title="Setup incomplete"></span></a>
    </nav>
    <div class="sidebar-bottom">
      <div hidden class="connect-card" id="agent-connect-prompt"><span data-icon="terminal"></span><strong>Start in your coding agent.</strong><p>Connect Raven over MCP.</p><a href="#connect">Connect an agent <span aria-hidden="true">↓</span></a></div>
      <div class="profile" id="profile"><span class="avatar" id="profile-avatar">YO</span><div><strong id="profile-name">Local operator</strong><small id="profile-note">Self-hosted workspace</small></div></div>
    </div>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="topbar-right"><span class="connection" id="connection"><i></i><span id="workspace-name">Local workspace</span></span><button type="button" data-action="help" class="icon-button" aria-label="Setup and help" title="Setup and help"><span data-icon="help"></span></button></div></header>
    <main id="main" tabindex="-1">
      <section class="page-head"><h1 id="page-title">Ask Raven</h1><div class="page-actions" id="page-actions"></div></section>
      <div id="app"><div class="empty" role="status"><span class="loading-dot"></span>Connecting to your workspace…</div></div>

    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
