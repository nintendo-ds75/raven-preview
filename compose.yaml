name: raven
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: raven
      POSTGRES_USER: raven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raven-local-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raven -d raven"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  app:
    build:
      context: .
      args:
        INSTALL_AGENTS: ${RAVEN_INSTALL_AGENTS:-false}
        INSTALL_TEAMS: ${RAVEN_INSTALL_TEAMS:-false}
        INSTALL_SEMANTIC: ${RAVEN_INSTALL_SEMANTIC:-true}
    environment:
      DATABASE_URL: postgresql://raven:${POSTGRES_PASSWORD:-raven-local-development}@db:5432/raven
      RAVEN_PUBLIC_URL: ${RAVEN_PUBLIC_URL:-http://localhost:7333}
      RAVEN_DEMO: ${RAVEN_DEMO:-0}
      RAVEN_DEV_LOGIN: ${RAVEN_DEV_LOGIN:-1}
      RAVEN_WORKSPACE_NAME: ${RAVEN_WORKSPACE_NAME:-}
      RAVEN_AGENTS: ${RAVEN_AGENTS:-0}
      RAVEN_WORKBENCH: ${RAVEN_WORKBENCH:-0}
      RAVEN_WORKBENCH_REPO_DIR: /repos/${RAVEN_INGEST_REPO_DIR:-}
      RAVEN_WORKBENCH_IMAGE: ${RAVEN_WORKBENCH_IMAGE:-python:3.13-slim-bookworm}
      RAVEN_INGEST_REPO_DIR: ${RAVEN_INGEST_REPO_DIR:-}
      RAVEN_INGEST_REPO: ${RAVEN_INGEST_REPO:-}
      RAVEN_MODEL_API: ${RAVEN_MODEL_API:-none}
      RAVEN_MODEL: ${RAVEN_MODEL:-claude-sonnet-5}
      RAVEN_FAST_MODEL: ${RAVEN_FAST_MODEL:-claude-haiku-4-5-20251001}
      RAVEN_EMBEDDINGS: ${RAVEN_EMBEDDINGS:-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAVEN_ADMIN_TOKEN: ${RAVEN_ADMIN_TOKEN:-}
      RAVEN_GITHUB_CLIENT_ID: ${RAVEN_GITHUB_CLIENT_ID:-}
      RAVEN_GITHUB_CLIENT_SECRET: ${RAVEN_GITHUB_CLIENT_SECRET:-}
      RAVEN_GITHUB_ORG: ${RAVEN_GITHUB_ORG:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RAVEN_AIRWEAVE_URL: ${RAVEN_AIRWEAVE_URL:-}
      AIRWEAVE_API_KEY: ${AIRWEAVE_API_KEY:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      RAVEN_SOURCE_SYNC_MINUTES: ${RAVEN_SOURCE_SYNC_MINUTES:-15}
      RAVEN_SLACK_BACKFILL_DAYS: ${RAVEN_SLACK_BACKFILL_DAYS:-30}
      RAVEN_SLACK_THREAD_DAYS: ${RAVEN_SLACK_THREAD_DAYS:-14}
      RAVEN_JIRA_BACKFILL_DAYS: ${RAVEN_JIRA_BACKFILL_DAYS:-90}
      RAVEN_GITHUB_APP_FILE: /data/raven-github-app.json
      RAVEN_GITHUB_APP_CLIENT_ID: ${RAVEN_GITHUB_APP_CLIENT_ID:-}
      RAVEN_GITHUB_APP_SLUG: ${RAVEN_GITHUB_APP_SLUG:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      RAVEN_GITHUB_REPOS: ${RAVEN_GITHUB_REPOS:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_FALLBACK_CHANNEL: ${SLACK_FALLBACK_CHANNEL:-}
      SLACK_API_BASE: ${SLACK_API_BASE:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_APP_ID: ${TEAMS_APP_ID:-}
      TEAMS_TENANT_ID: ${TEAMS_TENANT_ID:-}
      TEAMS_CLIENT_SECRET: ${TEAMS_CLIENT_SECRET:-}
      TEAMS_CHANNEL_ID: ${TEAMS_CHANNEL_ID:-}
      TEAMS_PEOPLE_JSON: ${TEAMS_PEOPLE_JSON:-}
      TEAMS_SERVICE_URL: ${TEAMS_SERVICE_URL:-https://smba.trafficmanager.net/teams/}
    ports:
      - "127.0.0.1:${RAVEN_PORT:-7333}:7333"
    volumes:
      - app_data:/data
      - ${RAVEN_REPOS_DIR:-./fixtures}:/repos:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; from raven.database import connect; db=connect(os.environ['DATABASE_URL'], autocommit=True); db.execute('SELECT 1'); db.close(); urllib.request.urlopen('http://127.0.0.1:7333/auth/login', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    init: true
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
