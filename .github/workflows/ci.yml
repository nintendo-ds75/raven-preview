name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pyflakes rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.7.4
      # Undefined names, unused imports and variables, syntax errors. Style is
      # not enforced; see ruff.toml.
      - run: ruff check .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image ships; 3.11 is the oldest the setup
        # wizard supports (tomllib).
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core is standard library only; cryptography is needed for the
      # GitHub App connection tests, as it is in the Docker image.
      - run: python -m pip install cryptography==49.0.0
      - name: Unit, integration and contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  postgres:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    # The whole behaviour contract suite runs against PostgreSQL; it took
    # about half an hour on a laptop.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bridge
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-postgres.txt
      - name: Behaviour contracts on PostgreSQL
        env:
          BRIDGE_TEST_POSTGRES: "1"
          DATABASE_URL: postgresql://bridge:bridge-ci@localhost:5432/bridge
        run: python -m unittest discover -s tests -p test_postgres.py -v

  web:
    name: Web UI logic (Node, no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The Playwright browser suites (tests/browser*.cjs, brief-*.cjs) need
      # Chromium and are run by hand before a release; see CONTRIBUTING.md.
      - name: DOM-stubbed UI checks
        run: |
          set -e
          for f in tests/interview-ui-unit.cjs tests/minimal-run-ui-unit.cjs \
                   tests/modal-lifecycle-ui-unit.cjs tests/web-agent-source-review.cjs \
                   tests/web-setup.cjs tests/web-work-item-context.cjs tests/audit-viewer.cjs; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
