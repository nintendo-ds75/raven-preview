name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pyflakes rules)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.7.4
      # Undefined names, unused imports and variables, syntax errors. Style is
      # not enforced; see ruff.toml.
      - run: ruff check .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image ships; 3.11 is the oldest the setup
        # wizard supports (tomllib).
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The core is standard library only; cryptography is needed for the
      # GitHub App connection tests, as it is in the Docker image, httpx by
      # the live-provider acceptance drivers under evals/, and PyJWT
      # (requirements-teams.txt) by the Teams callback tests, which skip
      # without it: 246 tests in seven files, among them every check of the
      # Bot Connector token verification.
      - run: python -m pip install cryptography==49.0.0 httpx==0.28.1 -r requirements-teams.txt -r requirements-agents.txt
      - name: Unit, integration and contract tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  postgres:
    name: Tests against PostgreSQL
    runs-on: ubuntu-latest
    # The whole behaviour contract suite runs against PostgreSQL; it took
    # about half an hour on a laptop.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bridge
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-postgres.txt
      - name: Behaviour contracts on PostgreSQL
        env:
          BRIDGE_TEST_POSTGRES: "1"
          DATABASE_URL: postgresql://bridge:bridge-ci@localhost:5432/bridge
        run: python -m unittest discover -s tests -p test_postgres.py -v

  web:
    name: Web UI logic (Node, no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The same list `make check` runs, kept in one file so the two cannot
      # drift. The Playwright browser suites (tests/browser*.cjs,
      # tests/brief-browser.cjs) need Chromium and are run by hand before a
      # release; see CONTRIBUTING.md.
      - name: DOM-stubbed UI checks
        run: ./scripts/check_web.sh

  startup-os-browser:
    name: Startup OS browser (Chromium, synthetic providers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned official Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/raven-ui" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/raven-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Native Today interactions and real local API
        env:
          BRIDGE_TEST_ARTIFACTS: test-results/startup-os
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/raven-ui/node_modules/playwright"
          node tests/browser-objectives.cjs
          node tests/browser-objectives-api.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-os-browser
          path: test-results/startup-os
          if-no-files-found: ignore

  execution-harnesses:
    name: Installed harnesses (scripted inference, no provider keys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install exact official harness dependency locks
        run: |
          npm ci --prefix hosts/pi --ignore-scripts
          npm ci --prefix hosts/opencode --ignore-scripts
      - name: Real SDK and native server loops with scripted inference only
        run: |
          node tests/pi-harness-unit.cjs
          node tests/pi-sdk-unit.cjs
          node tests/opencode-guard-unit.cjs
          python -c "from bridge.opencode_host import installation, VERSION; assert installation() == VERSION"
          PYTHONPATH=tests python -m unittest test_harness_protocol test_workbench_hosts test_opencode_host -v

  docker-verification:
    name: Docker packaging and independent no-network verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare test image and optional runtime image (no semantic model download)
        run: |
          docker pull python:3.13-slim-bookworm
          docker build --build-arg INSTALL_SEMANTIC=false -t raven-core-base .
          docker build -f docker/Dockerfile.harnesses -t raven-harnesses-ci .
      - name: Installed image acceptance with network disabled
        run: |
          docker run --rm --network none --entrypoint node raven-harnesses-ci tests/pi-sdk-unit.cjs
          docker run --rm --network none --entrypoint python raven-harnesses-ci -c "from bridge.opencode_host import installation, VERSION; assert installation() == VERSION"
          docker run --rm --network none --entrypoint python raven-harnesses-ci -m unittest discover -s tests -p test_opencode_host.py -v
      - name: Actual isolated behavioral verification receipts
        env:
          BRIDGE_TEST_DOCKER: "1"
        run: python -m unittest discover -s tests -p test_artifact_docker.py -v

  codex-native:
    name: Disabled Codex research containment (local scripted inference)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Install exact official app-server pin and fixture codec
        run: |
          npm ci --prefix hosts/codex --ignore-scripts
          python -m pip install zstandard==0.25.0
      - name: Native schema, shell/read/network denial and resumed containment
        env:
          BRIDGE_TEST_CODEX: "1"
        run: PYTHONPATH=tests python -m unittest test_codex_native -v
