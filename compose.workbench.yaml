# Build the normal Raven image first as raven-workbench-base.
# This profile gives the trusted Raven server Docker control. Never mount the
# socket into a task image; workbench_fs passes repository bytes through stdin.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.workbench
    user: root
    environment:
      BRIDGE_WORKBENCH: '1'
      BRIDGE_WORKBENCH_SANDBOX: docker
      RAVEN_HOST_CLAUDE_API_KEY: ${RAVEN_HOST_CLAUDE_API_KEY:-}
      RAVEN_HOST_CLAUDE_MODEL: ${RAVEN_HOST_CLAUDE_MODEL:-}
      RAVEN_HOST_CLAUDE_WORKSPACE_ID: ${RAVEN_HOST_CLAUDE_WORKSPACE_ID:-}
      RAVEN_HOST_CODEX_API_KEY: ${RAVEN_HOST_CODEX_API_KEY:-}
      RAVEN_HOST_CODEX_MODEL: ${RAVEN_HOST_CODEX_MODEL:-}
      RAVEN_HOST_PI_API_KEY: ${RAVEN_HOST_PI_API_KEY:-}
      RAVEN_HOST_PI_MODEL: ${RAVEN_HOST_PI_MODEL:-}
      RAVEN_HOST_PI_PROVIDER: ${RAVEN_HOST_PI_PROVIDER:-}
      RAVEN_HOST_PI_BASE_URL: ${RAVEN_HOST_PI_BASE_URL:-}
      RAVEN_HOST_PI_MODEL_API: ${RAVEN_HOST_PI_MODEL_API:-openai-completions}
      RAVEN_HOST_OPENCODE_API_KEY: ${RAVEN_HOST_OPENCODE_API_KEY:-}
      RAVEN_HOST_OPENCODE_MODEL: ${RAVEN_HOST_OPENCODE_MODEL:-}
      RAVEN_HOST_OPENCODE_PROVIDER: ${RAVEN_HOST_OPENCODE_PROVIDER:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
